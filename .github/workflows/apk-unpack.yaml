name: APK Analysis

permissions:
 contents: write

on:
    workflow_dispatch:
        inputs:
            url:
                description: 'APK file URL'
                required: true
                type: string

jobs:
    analyze-apk:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            # 通过 HTTP Range 按需读取 zip 条目，无需下载整个 APK。
            # 渠道包常达 2GB，实测读取关键文件仅需数秒、约 130KB 流量。
            - name: Unpack APK
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                APK_URL: ${{ github.event.inputs.url }}
              run: |
                pip install requests remotezip
                python tools/unpack.py
