name: Sync

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: mirror-main
  cancel-in-progress: false

jobs:
  sync-gitee:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            ref: main

        - name: Mirror to Gitee
          uses: yesolutions/mirror-action@662fce0eced8996f64d7fa264d76cddd84827f33
          with:
            REMOTE: 'https://gitee.com/opguess/idv-login.git'
            GIT_USERNAME: opguess
            GIT_PASSWORD: ${{ secrets.GITEE_TOKEN }}

  sync-gitea:
    runs-on: ubuntu-latest

    steps:
        - name: Refresh Gitea pull mirror
          env:
            GITEA_API_TOKEN: ${{ secrets.GITEA_API_TOKEN }}
          run: |
            curl --fail --silent --show-error --max-time 30 \
              --request POST \
              --header "Authorization: token $GITEA_API_TOKEN" \
              --output /dev/null \
              https://git.keygen.eu.org/api/v1/repos/keygen/idv-login/mirror-sync
