name: Sync

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: mirror-main
  cancel-in-progress: false

jobs:
  sync-gitee:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            ref: main

        - name: Mirror to Gitee
          uses: yesolutions/mirror-action@662fce0eced8996f64d7fa264d76cddd84827f33
          with:
            REMOTE: 'https://gitee.com/opguess/idv-login.git'
            GIT_USERNAME: opguess
            GIT_PASSWORD: ${{ secrets.GITEE_TOKEN }}

  sync-gitea:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            ref: main

        - name: Sync to Gitea over SSH
          env:
            GITEA_SSH_URL: ${{ secrets.GITEA_SSH_URL }}
            GITEA_SSH_KEY: ${{ secrets.GITEA_SSH_KEY }}
            GITEA_SSH_KNOWN_HOSTS: ${{ secrets.GITEA_SSH_KNOWN_HOSTS }}
          run: |
            # Keep the SSH endpoint and its resolved origin addresses out of logs.
            python3 - <<'PYMASK'
            import os, socket, urllib.parse
            host = urllib.parse.urlparse(os.environ["GITEA_SSH_URL"]).hostname
            print(f"::add-mask::{host}")
            for address in {entry[4][0] for entry in socket.getaddrinfo(host, None)}:
                print(f"::add-mask::{address}")
            PYMASK
            umask 077
            printf '%s\n' "$GITEA_SSH_KEY" > "$RUNNER_TEMP/gitea-key"
            printf '%s\n' "$GITEA_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/gitea-known-hosts"
            trap 'rm -f "$RUNNER_TEMP/gitea-key" "$RUNNER_TEMP/gitea-known-hosts"' EXIT
            export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/gitea-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/gitea-known-hosts -o ConnectTimeout=15"
            # Mirror compatibility branches too: hotfix URLs pin their commits.
            git push "$GITEA_SSH_URL" 'refs/remotes/origin/*:refs/heads/*' --tags
