name: Update Verification Data

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'assets/cloudRes.json'

jobs:
  plan-hotfix:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare published hotfix references
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 tools/verification_publication.py plan-hotfix --before "$BEFORE" --after "$AFTER" --output hotfix-plan.json
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.changed == 'true'
        with:
          name: verification-hotfix-plan
          path: hotfix-plan.json
          retention-days: 7

  update-verification:
    needs: plan-hotfix
    if: needs.plan-hotfix.outputs.changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: verification-hotfix-plan
      - name: Hash only newly referenced hotfix files
        run: python tools/verification_publication.py generate-hotfix --plan hotfix-plan.json --output hotfix-verification.json
      - name: Accumulate verification records
        run: python tools/verification_publication.py publish --delta hotfix-verification.json

  mirror:
    needs: update-verification
    uses: ./.github/workflows/mirror.yaml
    secrets: inherit
