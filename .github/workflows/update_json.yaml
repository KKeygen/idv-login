name: Update JSON Resources

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'assets/anno'
      - 'assets/index.html'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '精确版本标签；留空则保留当前云配置版本'
        required: false
        type: string
      critical_update:
        description: '是否为重要更新'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      critical_update:
        required: false
        default: false
        type: boolean

concurrency:
  group: update-cloud-resources-staging
  cancel-in-progress: false
  queue: max

jobs:
  update_json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q requests==2.33.1 markdown==3.3.7
      - name: Stage cloudRes.json for exact release (requires signing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_ROPE: ${{ secrets.GITEE_ROPE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CRITICAL_UPDATE: ${{ inputs.critical_update || false }}
        run: python tools/update_cloud_resources.py

  mirror:
    needs: update_json
    uses: ./.github/workflows/mirror.yaml
    secrets: inherit
