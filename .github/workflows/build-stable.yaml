name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*-stable"
      - "v*-beta"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [[ "$REF_TYPE" == tag && "$TAG" =~ ^v[0-9]+(\.[0-9]+)+-(stable|beta)$ ]] || {
            echo 'Select a version tag, not a branch, to release.' >&2
            exit 1
          }
          test -s "ext/${TAG}-CHANGELOG"
          if [[ "$TAG" == *-beta ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  check-quark:
    needs: prepare
    uses: ./.github/workflows/check-quark.yaml
    secrets: inherit

  build-windows:
    needs: [prepare, check-quark]
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.12.10"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Python Embedded (with dependencies)
        id: cache-python
        uses: actions/cache@v4
        with:
          path: python-embed
          key: windows-python-embed-deps-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}

      - name: Download Python Embedded
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/python-${{ env.PYTHON_VERSION }}-embed-amd64.zip -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python-embed

          $pthFile = Get-ChildItem -Path python-embed -Filter "python*._pth" | Select-Object -First 1
          $content = Get-Content $pthFile.FullName
          if ($content -match "#\s*import site") {
              $content = $content -replace "#\s*import site", "import site"
          } else {
              $content += "import site"
          }
          $content | Set-Content $pthFile.FullName -Encoding UTF8
        shell: pwsh

      - name: Set up Python Embedded
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          .\python-embed\python.exe get-pip.py
          .\python-embed\python.exe -m pip install --upgrade pip
          .\python-embed\python.exe -m pip install setuptools wheel
        shell: pwsh

      - name: Install dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          .\python-embed\python.exe -m pip install -r requirements.txt
          .\python-embed\python.exe -m pip install pywin32
        shell: pwsh

      - name: Insert build info
        shell: pwsh
        run: |
          $buildInfo = 'BUILD_INFO="Build in ${{github.run_id}}(${{github.sha}})"'
          $versionInfo = 'VERSION="${{github.ref_name}}"'
          $buildInfo | Out-File -FilePath src/buildinfo.py -Encoding utf8
          $versionInfo | Out-File -FilePath src/buildinfo.py -Encoding utf8 -Append

      - name: Compile Python files to .pyc
        run: |
            .\python-embed\python.exe  -m compileall src
            Get-ChildItem -Recurse -Filter '*.pyc' | ForEach-Object {
                $newName = $_.Name -replace '\.cpython-3\d+', ''
                if (Test-Path -Path (Join-Path -Path $_.DirectoryName -ChildPath $newName)) {
                    Remove-Item -Path (Join-Path -Path $_.DirectoryName -ChildPath $newName) -Force
                }
                Rename-Item -Path $_.FullName -NewName $newName
            }
            Get-ChildItem -Recurse -Filter '*.pyc' | ForEach-Object { Move-Item $_.FullName -Destination $_.Directory.Parent.FullName }
            Get-ChildItem -Recurse -Filter '*.py' | Remove-Item -Force
            Get-ChildItem -Recurse -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force
        shell: pwsh

      - name: Package application
        run: |
          mkdir dist
          Copy-Item -Recurse -Force python-embed dist/python-embed
          Copy-Item -Recurse -Force src dist/src
          New-Item -ItemType Directory -Force -Path dist/assets | Out-Null
          Copy-Item -Force assets/mpay.dll dist/assets/mpay.dll
          Copy-Item -Force assets/mpay_default_skin.zip dist/assets/mpay_default_skin.zip
          Copy-Item -Force tools/点我启动工具.bat dist/点我启动工具.bat
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Download Chinese language file
        run: |
          Invoke-WebRequest -Uri https://github.com/jrsoftware/issrc/raw/main/Files/Languages/ChineseSimplified.isl -OutFile inno/ChineseSimplified.isl
        shell: pwsh

      - name: Build installer
        run: |
          $outputBase = "idv-login-${{github.ref_name}}"
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $outputDir = (Resolve-Path dist-installer).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion="${{github.ref_name}}" `
            /DOutputBaseFilename=$outputBase `
            /DOutputDir=$outputDir `
            inno/idv-login.iss
        shell: pwsh

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            .\dist-installer\idv-login-${{github.ref_name}}.exe


  build-macos:
    needs: [prepare, check-quark]
    runs-on: macos-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Insert build info
        shell: bash
        run: |
          echo 'BUILD_INFO="Build in ${{github.run_id}}(${{github.sha}})"' > src/buildinfo.py
          echo 'VERSION="${{github.ref_name}}"' >> src/buildinfo.py

      - name: Build with PyInstaller
        run: |
          NAME="idv-login-${{github.ref_name}}-mac"
          pyinstaller -F src/main.py -n "$NAME" -i assets/icon.ico --add-data "src/resources:resources" --version-file assets/version.txt
        shell: bash

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-pyinstaller
          path: |
            dist/idv-login-${{github.ref_name}}-mac

  release:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete binaries
        run: |
          rm -rf binaries
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ext/${{github.ref_name}}-CHANGELOG
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            **/*.exe
            **/*-mac


  sync-release:
    needs: release
    uses: ./.github/workflows/sync_release.yaml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
