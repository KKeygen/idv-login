name: Build and Package

permissions:
  contents: read

on:
    workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: [3.12.10]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Python Embedded (with dependencies)
        id: cache-python
        uses: actions/cache@v4
        with:
          path: python-embed
          key: windows-python-embed-deps-v2-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Download Python Embedded
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri https://www.python.org/ftp/python/${{ matrix.python-version }}/python-${{ matrix.python-version }}-embed-amd64.zip -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python-embed

          $pthFile = Get-ChildItem -Path python-embed -Filter "python*._pth" | Select-Object -First 1
          $content = Get-Content $pthFile.FullName
          if ($content -match "#\s*import site") {
              $content = $content -replace "#\s*import site", "import site"
          } else {
              $content += "import site"
          }
          $content | Set-Content $pthFile.FullName -Encoding UTF8

      - name: Set up Python Embedded
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          .\python-embed\python.exe get-pip.py
          .\python-embed\python.exe -m pip install --upgrade pip
          .\python-embed\python.exe -m pip install setuptools wheel
        shell: pwsh

      - name: Install dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          .\python-embed\python.exe -m pip install -r requirements.txt
          .\python-embed\python.exe -m pip install pywin32

      - name: Stage signed Microsoft WebView2 loader
        run: ./python-embed/python.exe tools/prepare_webview2_loader.py
        shell: pwsh

      - name: Insert build info
        run: |
          $buildInfo = 'BUILD_INFO="Build in ${{github.run_id}}(${{github.sha}})"'
          $versionInfo = 'VERSION="${{github.ref_name}}"'
          $buildInfo | Out-File -FilePath src/buildinfo.py -Encoding utf8
          $versionInfo | Out-File -FilePath src/buildinfo.py -Encoding utf8 -Append
        shell: pwsh

      - name: Compile application Python files
        run: |
          .\python-embed\python.exe -m compileall -b src
          if ($LASTEXITCODE -ne 0) { throw "Application compilation failed" }
        shell: pwsh

      - name: Package application
        run: |
          mkdir dist
          Copy-Item -Recurse -Force python-embed dist/python-embed
          Copy-Item -Recurse -Force src dist/src
          New-Item -ItemType Directory -Force -Path dist/assets | Out-Null
          Copy-Item -Force assets/mpay.dll dist/assets/mpay.dll
          Copy-Item -Force assets/mpay_default_skin.zip dist/assets/mpay_default_skin.zip
          Copy-Item -Force tools/点我启动工具.bat dist/点我启动工具.bat
        shell: pwsh

      - name: Set up packaging tools (not shipped)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Slim staged Qt runtime
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw "Packaging tools installation failed" }
          python tools/slim_windows_qt.py --qt-root dist/python-embed/Lib/site-packages/PyQt6 --source-root src --report build-reports/windows-qt-size.json --apply
          if ($LASTEXITCODE -ne 0) { throw "Qt packaging analysis failed" }
          # The non-Windows browser implementations are not shipped on Windows.
          Get-ChildItem dist/src -Recurse -File | Where-Object {
            $_.Name -match '^(?:.+_legacy|web_uimgr)(?:\.[^.]+)*\.(?:py|pyc)$'
          } | Remove-Item -Force
          Get-ChildItem -Path dist/src -Recurse -Filter '*.py' | Remove-Item -Force
          Get-ChildItem -Path dist -Recurse -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force
        shell: pwsh

      - name: Check staged Windows Qt runtime
        run: |
          .\dist\python-embed\python.exe -B -u -X faulthandler tools/smoke_windows_qt.py assets/icon.ico
          if ($LASTEXITCODE -ne 0) { throw "Qt packaging smoke check failed ($LASTEXITCODE)" }
        shell: pwsh

      - name: Archive Qt size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qt-size-report
          path: build-reports/windows-qt-size.json
          if-no-files-found: warn

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Download Chinese language file
        run: |
          Invoke-WebRequest -Uri https://github.com/jrsoftware/issrc/raw/main/Files/Languages/ChineseSimplified.isl -OutFile inno/ChineseSimplified.isl
        shell: pwsh

      - name: Build installer
        run: |
          $outputBase = "idv-login-${{github.ref_name}}-Py${{ matrix.python-version }}"
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $outputDir = (Resolve-Path dist-installer).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion="${{github.ref_name}}" `
            /DOutputBaseFilename=$outputBase `
            /DOutputDir=$outputDir `
            inno/idv-login.iss
        shell: pwsh

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            .\dist-installer\idv-login-${{github.ref_name}}-Py${{ matrix.python-version }}.exe

  build-macos:
    runs-on: macos-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Insert build info
        shell: bash
        run: |
          echo 'BUILD_INFO="Build in ${{github.run_id}}(${{github.sha}})"' > src/buildinfo.py
          echo 'VERSION="${{github.ref_name}}"' >> src/buildinfo.py

      - name: Build with PyInstaller
        run: |
          NAME="idv-login-${{github.ref_name}}-mac"
          pyinstaller -F src/main.py -n "$NAME" -i assets/icon.ico
        shell: bash

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-pyinstaller
          path: |
            dist/idv-login-${{github.ref_name}}-mac
